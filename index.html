<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لمسة ورق شهد</title>
<style>
body{margin:0;font-family:system-ui;background:#fff5f8;color:#4a2c35}
header{background:#ff8fb3;color:white;padding:22px 16px;text-align:center;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;opacity:.95}
.search{margin:16px;padding:12px;border:2px solid #ffd0de;border-radius:16px;background:white;display:flex;gap:8px}
.search input{border:0;outline:0;flex:1;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 100px}
.card{background:white;border-radius:20px;padding:10px;box-shadow:0 4px 14px #ffd9e5;text-align:center}
.card .emoji{font-size:42px}
.card h3{margin:8px 0 2px;font-size:16px}
.card p{margin:0;color:#888;font-size:13px}
.price{color:#e7548a;font-weight:800;margin:8px 0}
button{border:0;background:#ff5c8f;color:white;padding:10px 14px;border-radius:12px;font-weight:700;width:100%}
.cart{position:fixed;bottom:16px;left:16px;right:16px;background:#4a2c35;color:white;padding:14px;border-radius:18px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header><h1>🎀 لمسة ورق شهد 🎀</h1><p>نوت بوك - ستيكرز - حاجات هاند ميد بحب</p></header>
<div class="search"><span>🔍</span><input id="s" placeholder="دوري هنا... نوت بوك، ستيكرز" oninput="filter()"></div>
<div class="grid" id="grid"></div>
<div class="cart"><span>🛒 السلة: <b id="count">0</b> منتج</span><span id="total">0 جنيه</span></div>
<script>
let items=[
{name:"نوت بوك بينك",price:120,emoji:"📓",cat:"نوت بوك"},
{name:"نوت بوك ورود",price:150,emoji:"🌸",cat:"نوت بوك"},
{name:"ستيكرز كيوت",price:45,emoji:"✨",cat:"ستيكرز"},
{name:"ستيكرز قلوب",price:50,emoji:"💖",cat:"ستيكرز"},
{name:"بوكمارك هاند ميد",price:35,emoji:"🔖",cat:"هاند ميد"},
{name:"كارت تهنئة",price:60,emoji:"💌",cat:"هاند ميد"},
];
let count=0,total=0;
function show(list){
document.getElementById('grid').innerHTML=list.map((it,i)=>`<div class="card"><div class="emoji">${it.emoji}</div><h3>${it.name}</h3><p>${it.cat}</p><div class="price">${it.price} جنيه</div><button onclick="add(${it.price})">أضيفي للسلة +</button></div>`).join('');
}
function add(p){count++;total+=p;document.getElementById('count').innerText=count;document.getElementById('total').innerText=total+" جنيه";alert("اتضاف للسلة 🎀");}
function filter(){let v=document.getElementById('s').value;show(items.filter(x=>x.name.includes(v)||x.cat.includes(v)));}
show(items);
</script>
</body>
</html>
